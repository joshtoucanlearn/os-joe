<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Joe's projects</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/joe.css">
</head>
<body>
  <main class="projects">
    <div class="projects-top">
      <h1>Projects</h1>
      <a class="home-link" href="../">Home</a>
    </div>
    <div class="tabs tabs-five" role="tablist" aria-label="Choose a project">
      <button type="button" role="tab" data-project="darty" aria-selected="true">DARTY</button>
      <button type="button" role="tab" data-project="drinks" aria-selected="false">Drinks</button>
      <button type="button" role="tab" data-project="wall" aria-selected="false">Notes</button>
      <button type="button" role="tab" data-project="snake" aria-selected="false">Snake</button>
      <button type="button" role="tab" data-project="frogger" aria-selected="false">Frogger</button>
    </div>
    <section id="stage" role="tabpanel" aria-live="polite"></section>
  </main>
  <script type="module">
    import { initSky } from '../assets/sky.js';
    import { mountSnake, mountFrogger } from '../assets/arcade.js';
    import { mountDarty, mountDrinks } from '../assets/joe-projects.js';
    import { mountWall } from '../assets/wall.js';
    initSky();
    const projects = { darty: mountDarty, drinks: mountDrinks, wall: mountWall, snake: mountSnake, frogger: mountFrogger };
    const stage = document.getElementById('stage');
    const tabs = [...document.querySelectorAll('[data-project]')];
    let destroy = () => {};
    function open(name) {
      destroy();
      stage.replaceChildren();
      stage.dataset.project = name;
      tabs.forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.project === name)));
      destroy = projects[name](stage) || (() => {});
      if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
    }
    tabs.forEach(tab => tab.addEventListener('click', () => open(tab.dataset.project)));
    addEventListener('hashchange', () => { const name = location.hash.slice(1); if (projects[name]) open(name); });
    open(projects[location.hash.slice(1)] ? location.hash.slice(1) : 'darty');
  </script>
</body>
</html>
